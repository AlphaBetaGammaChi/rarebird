name: Daily rarity forecast

on:
  schedule:
    - cron: "15 5 * * *"        # ~05:15 UTC, after eBird's overnight update
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight — eBird key present?
        id: key
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          if [ -n "$EBIRD_API_KEY" ]; then
            echo "haskey=true" >> "$GITHUB_OUTPUT"
          else
            echo "haskey=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EBIRD_API_KEY secret not set — building from existing data only"
          fi

      - name: Fetch recent notables (worldwide)
        working-directory: pipeline
        if: steps.key.outputs.haskey == 'true'
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: python3 fetch_notables.py --db notables.sqlite --days 7

      - name: Refresh hotspots + regions (weekly-ish)
        working-directory: pipeline
        if: steps.key.outputs.haskey == 'true' && (github.event_name == 'workflow_dispatch' || github.run_number % 7 == 1)
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: python3 fetch_reference.py --db notables.sqlite

      - name: Learn arrival wind fingerprints (weekly-ish)
        working-directory: pipeline
        if: github.event_name == 'workflow_dispatch' || github.run_number % 7 == 1
        run: python3 fingerprints.py --db notables.sqlite

      - name: Compute back-trajectories (weekly-ish)
        working-directory: pipeline
        if: github.event_name == 'workflow_dispatch' || github.run_number % 7 == 1
        run: python3 tracks.py --db notables.sqlite

      - name: eBird barchart frequencies (optional, set FREQUENCY_REGIONS var)
        working-directory: pipeline
        if: vars.FREQUENCY_REGIONS != ''
        run: python3 frequency.py --db notables.sqlite --regions "$FREQUENCY_REGIONS"
        env:
          FREQUENCY_REGIONS: ${{ vars.FREQUENCY_REGIONS }}

      - name: Build forecast JSON + RSS feeds
        working-directory: pipeline
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 build_forecasts.py --db notables.sqlite --out ../site/data --feeds --site-url "$SITE_URL"

      - name: Evaluate forecast skill
        working-directory: pipeline
        run: python3 evaluate.py --db notables.sqlite --out ../site/data

      - name: Weekend digest webhook (Fridays; needs DIGEST_WEBHOOK secret)
        working-directory: pipeline
        env:
          DIGEST_WEBHOOK: ${{ secrets.DIGEST_WEBHOOK }}
          DIGEST_COUNTRIES: ${{ vars.DIGEST_COUNTRIES }}
        run: python3 notify.py --data ../site/data

      - name: Commit updated data + db
        run: |
          git config user.name "rarebird-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data site/feeds pipeline/notables.sqlite
          git diff --cached --quiet || git commit -m "forecast update $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
